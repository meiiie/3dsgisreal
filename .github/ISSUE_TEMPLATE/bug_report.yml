name: Bug report
description: Report a reproducible bug in the app, pipeline, docs, or local tooling.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include exact commands, routes, inputs, or browser steps.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Node 22, pnpm 10, Chrome 126
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets, private capture data, and private addresses.
